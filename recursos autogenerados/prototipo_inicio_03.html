    nav {

      align-items: center;
      height: 60px;
      border-bottom: 3px solid #3f51b5;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 1.1em;
      padding: 10px 20px;
      border-radius: 8px;
    }
    nav a:focus, nav a[aria-current="page"] {
      background: #3949ab;

      box-shadow: 0 1px 6px #bbb2;

      background: #1a237e;

</head>
