<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Musearte</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js"></script>
  </head>
  <body>
    <header id="main-header"></header>
    <main>
      <section class="ubicacion-museo" aria-label="Museo actual">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <circle
            cx="10"
            cy="10"
            r="8"
            stroke="#3f51b5"
            stroke-width="2"
            fill="none"
          ></circle>
          <circle cx="10" cy="10" r="3" fill="#3f51b5"></circle>
        </svg>
        Museo del Prado, Madrid
      </section>
      <section class="busqueda-museo" aria-labelledby="buscar-museo-label">
        <label id="buscar-museo-label" for="buscar-museo">Buscar museo</label>
        <input
          type="search"
          id="buscar-museo"
          name="buscar-museo"
          placeholder="Introduce el nombre del museo"
          aria-describedby="buscar-museo-desc"
        />
      </section>

      <button
        id="boton-camara"
        class="boton-camara"
        type="button"
        aria-label="Activar cámara y reconocer una obra"
        onclick="activarCamara()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="7" width="18" height="12" rx="2" ry="2" />
          <circle cx="12" cy="13" r="3" fill="#3f51b5" />
          <!-- <path d="M7 7V5a2 2 0 012-2h6a2 2 0 012 2v2" /> -->
          <path
            d="m5.16,7l0,-1.24a0.99,1.24 0 0 1 0.99,-1.24l2.96,0a0.99,1.24 0 0 1 0.99,1.24l0,1.24"
          />
        </svg>
        Activar cámara y reconocer obra
      </button>
      <video id="camara" style="display: none"></video>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
